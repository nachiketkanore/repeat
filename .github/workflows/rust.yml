name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.91
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.91.0
    - name: Build
      run: cargo build --release --verbose
    - name: Run tests
      run: cargo test --verbose
